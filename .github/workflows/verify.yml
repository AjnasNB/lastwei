name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start isolated UI test fixtures
        run: |
          node scripts/local-evm.mjs > /tmp/lastwei-evm.log 2>&1 &
          npm run dev -- --port 4173 > /tmp/lastwei-vite.log 2>&1 &
          node scripts/wait-for-local.mjs
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-evidence
          path: |
            test-results/
            playwright-report/
